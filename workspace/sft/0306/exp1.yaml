### model
model_name_or_path: /cpfs2/shared/models/Qwen3.5/Qwen3.5-2B-Base
image_max_pixels: 589824 # 768 * 768
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z2_config.json

flash_attn: fa2
## training nums 2600525
## steps = 2600525 / (2 * 8 * 4GPU) = 40,633.203125
### streaming
buffer_size: 128
preprocessing_batch_size: 128
streaming: true
accelerator_config:
  dispatch_batches: false
max_steps: 40633


### dataset
# dataset: mllm_demo,identity,alpaca_en_demo
dataset: ocrsft_4_0_html_train
template: qwen3_5_nothink
cutoff_len: 8192
# max_samples: 1000
preprocessing_num_workers: 16
dataloader_num_workers: 8


### output
# exp_name: qwen3_5_2b_base_ocr_sft_0306_exp1

output_dir: saves/ocr_sft/qwen3_5_2b_base_ocr_sft_0306_exp1
logging_steps: 10
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: qwen3_5_2b_base_ocr_sft_0306_exp1

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 3.0e-6
# num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05 ## 2600 steps
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
# val_size: 0.1
eval_dataset: ocrsft_4_0_html_eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 500
